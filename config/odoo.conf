[options]
; ─────────────────────────────────────────────────────────────────────────────
; Cargo Marketplace — Docker Odoo Configuration
; Used by docker-compose.yml
; For production, copy odoo.conf.example and customize.
; ─────────────────────────────────────────────────────────────────────────────

; Database — values come from docker-compose environment
db_host     = db
db_port     = 5432
db_user     = cargo_user
db_password = cargo_dev_password
db_name     = cargo_db
db_maxconn  = 64

; HTTP
http_port        = 8069
longpolling_port = 8072
proxy_mode       = False

; Addons path — includes both Odoo Community and Cargo custom addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Workers (0 = single-threaded dev mode)
workers          = 0
max_cron_threads = 1

; Logging
log_level = info
logfile   = /var/log/odoo/odoo.log

; Data
data_dir = /var/lib/odoo

; Security (CHANGE for production)
admin_passwd = cargo_dev_master_password
list_db      = True

; Development mode (comment out for production)
; dev_mode = reload,qweb,werkzeug,xml
without_demo = all
